version: '3.8'

# =============================================================================
# 🎬 Comic Video 基础设施服务
# 仅包含数据库、缓存和文件存储服务，应用本身在本地运行
# =============================================================================

services:
  # =============================================================================
  # 🗄️ PostgreSQL 数据库
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: comic_video_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comic_video}
      POSTGRES_USER: ${POSTGRES_USER:-comic_video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comic_video_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - comic_video_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comic_video} -d ${POSTGRES_DB:-comic_video}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================================================
  # 🔴 Redis 缓存
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: comic_video_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-comic_video_redis}
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - comic_video_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # =============================================================================
  # 📁 MinIO 对象存储
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: comic_video_minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comic_video}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comic_video_minio_password}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - comic_video_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # =============================================================================
  # 🔧 MinIO 初始化（创建默认存储桶）
  # =============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: comic_video_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - comic_video_network
    entrypoint: >
      /bin/sh -c "
      echo '🔧 配置MinIO客户端...' &&
      /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-comic_video} ${MINIO_ROOT_PASSWORD:-comic_video_minio_password} &&
      echo '📁 创建存储桶...' &&
      /usr/bin/mc mb minio/comic-video-uploads --ignore-existing &&
      /usr/bin/mc mb minio/comic-video-outputs --ignore-existing &&
      /usr/bin/mc mb minio/comic-video-temp --ignore-existing &&
      echo '🔐 设置存储桶策略...' &&
      /usr/bin/mc anonymous set public minio/comic-video-uploads &&
      /usr/bin/mc anonymous set public minio/comic-video-outputs &&
      echo '✅ MinIO初始化完成!'
      "

# =============================================================================
# 📦 数据卷
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# =============================================================================
# 🌐 网络
# =============================================================================
networks:
  comic_video_network:
    driver: bridge
    name: comic_video_network
